<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PromptGuard</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 320px;
      min-height: 200px;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #0f0f26;
      color: #e8eaf0;
      font-size: 13px;
    }

    .popup-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 16px 18px 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }

    .popup-logo {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6, #a855f7);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      box-shadow: 0 0 16px rgba(99, 102, 241, 0.25);
    }

    .popup-title {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -0.3px;
    }

    .popup-subtitle {
      font-size: 11px;
      color: #6b7280;
    }

    .popup-body {
      padding: 14px 18px;
    }

    /* Toggle Row */
    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .toggle-row-label {
      font-size: 13px;
      font-weight: 500;
      color: #9ba3b5;
    }

    .toggle {
      position: relative;
      width: 44px;
      height: 24px;
      cursor: pointer;
    }

    .toggle input {
      opacity: 0;
      width: 0;
      height: 0;
      position: absolute;
    }

    .toggle-slider {
      position: absolute;
      inset: 0;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 100px;
      transition: background 0.2s;
    }

    .toggle-slider::before {
      content: '';
      position: absolute;
      top: 3px;
      left: 3px;
      width: 18px;
      height: 18px;
      background: #6b7280;
      border-radius: 50%;
      transition: transform 0.2s, background 0.2s;
    }

    .toggle input:checked + .toggle-slider {
      background: #6366f1;
    }

    .toggle input:checked + .toggle-slider::before {
      transform: translateX(20px);
      background: white;
    }

    /* Status Section */
    .status-section {
      padding: 12px 14px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 10px;
      margin-bottom: 12px;
    }

    .status-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    .status-row:last-child {
      margin-bottom: 0;
    }

    .status-label {
      font-size: 12px;
      color: #6b7280;
    }

    .status-value {
      font-size: 12px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
    }

    .status-dot.online {
      background: #34d399;
      box-shadow: 0 0 8px rgba(16, 185, 129, 0.4);
    }

    .status-dot.offline {
      background: #f87171;
      box-shadow: 0 0 8px rgba(239, 68, 68, 0.4);
    }

    /* Dashboard Link */
    .popup-footer {
      padding: 10px 18px 16px;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
    }

    .dashboard-link {
      display: block;
      text-align: center;
      padding: 8px;
      background: rgba(99, 102, 241, 0.1);
      border: 1px solid rgba(99, 102, 241, 0.2);
      border-radius: 8px;
      color: #a5b4fc;
      font-size: 12px;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.15s;
    }

    .dashboard-link:hover {
      background: rgba(99, 102, 241, 0.18);
      color: white;
    }
  </style>
</head>
<body>

  <div class="popup-header">
    <div class="popup-logo">🛡️</div>
    <div>
      <div class="popup-title">PromptGuard</div>
      <div class="popup-subtitle">AI Firewall Gateway</div>
    </div>
  </div>

  <div class="popup-body">
    <div class="toggle-row">
      <span class="toggle-row-label">Prompt Interception</span>
      <label class="toggle">
        <input type="checkbox" id="enable-toggle" checked>
        <span class="toggle-slider"></span>
      </label>
    </div>

    <div class="status-section">
      <div class="status-row">
        <span class="status-label">Gateway</span>
        <span class="status-value">
          <span class="status-dot" id="gateway-dot"></span>
          <span id="gateway-status">Checking...</span>
        </span>
      </div>
      <div class="status-row">
        <span class="status-label">Current Site</span>
        <span class="status-value" id="current-site">—</span>
      </div>
      <div class="status-row">
        <span class="status-label">Pipeline</span>
        <span class="status-value" style="color: #34d399;">4 Stages Active</span>
      </div>
    </div>
  </div>

  <div class="popup-footer">
    <div style="padding: 0 0 10px; font-size: 11px; color: #6b7280;">
      <div style="margin-bottom: 6px; font-weight: 600; color: #9ba3b5;">Supported Sites</div>
      <div style="display: flex; flex-wrap: wrap; gap: 6px;">
        <span style="background: rgba(255,255,255,0.04); padding: 2px 8px; border-radius: 6px;">🤖 ChatGPT</span>
        <span style="background: rgba(255,255,255,0.04); padding: 2px 8px; border-radius: 6px;">🟠 Claude</span>
        <span style="background: rgba(255,255,255,0.04); padding: 2px 8px; border-radius: 6px;">💎 Gemini</span>
        <span style="background: rgba(255,255,255,0.04); padding: 2px 8px; border-radius: 6px;">🌀 Mistral</span>
        <span style="background: rgba(255,255,255,0.04); padding: 2px 8px; border-radius: 6px;">⚡ Groq</span>
        <span style="background: rgba(255,255,255,0.04); padding: 2px 8px; border-radius: 6px;">🪸 Cohere</span>
      </div>
    </div>
    <a href="http://localhost:8000/chat" target="_blank" class="dashboard-link">
      Open PromptGuard Chat Dashboard →
    </a>
  </div>

  <script src="popup.js"></script>

</body>
</html>

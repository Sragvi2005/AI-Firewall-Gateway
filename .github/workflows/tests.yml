name: tests

on:
  push:
    branches:
      - feat/Anvithv1-branch
  pull_request:
    branches:
      - main
      - feat/Anvithv1-branch

jobs:
  pytest:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: pytest -q
